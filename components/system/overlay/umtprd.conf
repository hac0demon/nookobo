# /etc/umtprd/umtprd.conf - uMTP-Responder configuration for BNRV700
# Exposes /data/media/0 (internal user storage: Books, Downloads) over USB MTP

# Loop daemon to stay alive across USB disconnects/reconnects
loop_on_disconnect 1

# Shared storage mapping
storage "/data/media/0" "NOOK Internal Storage" "rw"

# USB Device Descriptors
manufacturer "Barnes & Noble"
product "NOOK GlowLight Plus"
serial "BNRV700"
firmware_version "4.4.2"
interface "MTP"

# USB Character Device node on Android Linux kernel (GadgetFS mode)
usb_functionfs_mode 0
usb_dev_path "/dev/mtp_usb"
